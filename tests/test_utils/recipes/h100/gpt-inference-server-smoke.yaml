type: basic
format_version: 1
maintainers: [mcore]
loggers: [stdout]
spec:
  name: '{test_case}_{environment}_{platforms}'
  model: gpt
  build: mcore-pyt-{environment}
  nodes: 1
  gpus: 8
  n_repeat: 1
  platforms: dgx_a100
  script_setup: |
    unset https_proxy
    echo "machine gitlab-master.nvidia.com login okoenig password $RO_API_TOKEN" | tee -a /root/.netrc

    # Checkout latest
    cd /opt
    rm -rf /opt/megatron-lm; mkdir megatron-lm; cd megatron-lm
    git init
    git remote add origin $MCORE_REPO
    git fetch origin '+refs/merge-requests/*:refs/remotes/merge-requests/*'
    git fetch origin $MCORE_MR_COMMIT
    git checkout $MCORE_MR_COMMIT
    git rev-parse HEAD
    # Checkout backwards-ref
    cd /opt
    rm -rf /opt/megatron-lm-legacy; mkdir megatron-lm-legacy; cd megatron-lm-legacy
    git init
    git remote add origin $MCORE_REPO
    git fetch origin $MCORE_BACKWARDS_COMMIT
    git checkout $MCORE_BACKWARDS_COMMIT
    git rev-parse HEAD
    rm -rf megatron; cp -a /opt/megatron-lm/megatron ./
  script: |-
    cd /opt/megatron-lm

    python \
      tests/functional_tests/test_cases/gpt/gpt_inference_server_smoke_tp1_pp1_dp8_583m/serve_smoke.py \
      --checkpoint-dir /mnt/artifacts/model/mcore_mistral/nemo_minitron-0.5b/v1 \
      --tokenizer-model /mnt/artifacts/model/mcore_mistral/nemo_minitron-0.5b/v1/multiMixV8.gpt4o_nc_sd.500000.128k.vocab.json \
      --server-log-dir {assets_dir}/logs/1 \
      --prefix-cache-compare \
      --prefix-cache-stress-cycles 3

    python - <<'PY'
    import re
    from pathlib import Path

    hit_ranks = {
        int(log.parent.name)
        for log in Path("{assets_dir}/logs/1").rglob("std*.log")
        if re.search(r"prefix cache \(cumul\): [1-9][0-9]* hits", log.read_text())
    }
    assert hit_ranks == set(range(8)), f"load-balanced cache hits reached ranks {hit_ranks}"
    PY

products:
  - test_case: [gpt_inference_server_smoke_tp1_pp1_dp8_583m]
    products:
      - environment: [dev]
        scope: [mr]
        platforms: [dgx_h100]
