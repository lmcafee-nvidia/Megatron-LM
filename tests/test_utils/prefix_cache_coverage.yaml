unsupported:
  async_scheduler:
    category: unsupported
    description: Prefix caching with asynchronous dynamic-engine scheduling.
    reason: Production configuration rejects this combination, so a positive execution-stress test would be dishonest.
    values:
      schedule_mode: [async_serial, async_overlap]

  uvm_backing:
    category: external
    description: Prefix-cache pressure with unified virtual memory backing.
    reason: The UVM path is not currently runnable by the active Megatron unit fixture and has no functional stress owner.
    values:
      memory_backing: uvm

  mla_layout:
    category: external
    description: Prefix reuse with the MLA KV layout.
    reason: Dynamic inference has no active MLA model fixture that can produce repeated cache hits and cache-off parity.
    values:
      architecture: mla

  http_api:
    category: external
    description: Prefix-cache stress through the HTTP inference API.
    reason: The HTTP result surface does not currently expose enough cache-hit and pressure evidence for this contract.
    values:
      api_surface: http

  rl_refit:
    category: external
    description: Prefix reuse across reinforcement-learning weight refits.
    reason: The RL worker and refit lifecycle are owned by an external integration environment, not this active test suite.
    values:
      api_surface: rl_refit
      worker_cache_state: refit

  request_cancellation:
    category: unsupported
    description: Explicit cancellation of an in-flight cached request.
    reason: Dynamic inference has no public request-cancellation operation to exercise.
    values:
      termination: cancellation

  below_one_mamba_slot:
    category: unsupported
    description: A durable Mamba prefix budget smaller than one usable slot.
    reason: This is an invalid configuration rejected at construction, not a positive prefix-cache execution mode.
    values:
      prefix_mamba_budget: below_one_slot

  zmq_sync_transport:
    category: external
    description: Coordinator cache routing through synchronous ZMQ.
    reason: Active coordinator stress uses the asynchronous production client; no synchronous end-to-end workload records hit and invalidation evidence.
    values:
      api_surface: coordinator_client
      transport: zmq_sync

  moe_lru:
    category: external
    description: MoE routing reconstruction under LRU cache eviction.
    reason: The active MoE functional workload stresses REF_ZERO only.
    values:
      architecture: moe
      eviction_policy: lru

  gpt_sequence_parallel:
    category: external
    description: GPT prefix-cache stress with sequence parallelism.
    reason: The TP2/PP2 CUDA-graph workload does not enable sequence parallelism; only the MoE workload currently does.
    values:
      architecture: gpt
      parallelism: tp_pp_sp

  hybrid_refzero_cuda_graph:
    category: external
    description: Hybrid CUDA-graph prefix reuse under REF_ZERO.
    reason: Active hybrid graph workloads use LRU, while active REF_ZERO hybrid execution is eager.
    values:
      architecture: hybrid
      eviction_policy: ref_zero
      execution_mode: cuda_graph

  coordinator_refzero:
    category: external
    description: Data-parallel coordinator routing while workers use REF_ZERO.
    reason: Every active coordinator functional workload uses LRU.
    values:
      api_surface: coordinator_client
      eviction_policy: ref_zero

  hybrid_coordinator_policy_variants:
    category: external
    description: Hybrid coordinator execution with first-block and load-balanced policies.
    reason: Hybrid coordinator stress currently covers longest-prefix routing only.
    values:
      architecture: hybrid
      coordinator_policy: [first_prefix_block, load_balanced]

  flashinfer_cross_product:
    category: external
    description: FlashInfer sampling and fused RoPE across every architecture and eviction policy.
    reason: The active FlashInfer workload is GPT with LRU; the remaining architecture-policy pairs have no functional stress owner.
    values:
      sampling_backend: flashinfer
      rope_backend: flashinfer_fused
      architecture: [hybrid, moe]

  graph_speculation:
    category: external
    description: Prefix-cache CUDA graph replay combined with speculative decoding.
    reason: Graph replay and MTP rewind are each stressed, but not in the same execution workload.
    values:
      execution_mode: cuda_graph
      speculation: mtp

  graph_prompt_logprobs:
    category: external
    description: Prompt-logprob bypass while cache hits execute through CUDA graphs.
    reason: Prompt-logprob bypass is stressed in eager and chunked execution, while graph workloads return generated-token outputs.
    values:
      execution_mode: cuda_graph
      output_mode: prompt_logprobs

  admission_failure_points:
    category: external
    description: Transactional rollback after later allocator, Mamba, hash, and routing mutations.
    reason: Active rollback stress injects a real failure after matching and pinning; the later mutation points do not yet have fault-injection hooks.
    values:
      failure_point: [after_block_allocation, after_hash_registration, after_mamba_slot, after_routing_state]

  graph_prefill_scope_variants:
    category: external
    description: Each configurable CUDA graph prefill scope under repeated prefix hits.
    reason: Active graph tests prove decode, prefill, and mixed replay, but do not vary every graph-scope configuration.
    values:
      graph_prefill_scope: [decode_only, mixed_bounded, all_prefills]

  graph_sizing_variants:
    category: external
    description: Linear and exponential CUDA graph bucket sizing under repeated prefix hits.
    reason: Active graph workloads use their configured default sizing rather than comparing both sizing algorithms.
    values:
      graph_sizing: [linear, exponential]

  mamba_memory_only_mode:
    category: external
    description: Hybrid execution with live Mamba request state but no durable Mamba prefix slots.
    reason: Unit depth stress exercises the memory-only matching branch, but no cache-off/cache-on model workload owns this runtime mode.
    values:
      architecture: hybrid
      mamba_cache_mode: memory_only

  mamba_live_pool_ratios:
    category: external
    description: Supported live-Mamba memory split boundaries under prefix-cache churn.
    reason: Active tests vary durable KV-to-Mamba capacity, not the live request-state reservation ratio.
    values:
      architecture: hybrid
      mamba_live_ratio: [small, balanced, large]

  exactly_one_mamba_slot:
    category: external
    description: Repeated hybrid prefix reuse with exactly one usable durable Mamba slot.
    reason: Active pressure tests use multiple durable slots; the single-slot boundary has no execution-stress owner.
    values:
      architecture: hybrid
      prefix_mamba_budget: exactly_one_slot

  moe_rank_consensus:
    category: external
    description: Direct evidence that every expert-parallel rank reconstructs identical cached routing.
    reason: The MoE workload compares returned routing with cache off and on, but does not emit a separate cross-rank consensus counter.
    values:
      architecture: moe
      parallelism: moe_tp_ep_sp
